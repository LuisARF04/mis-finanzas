name: Avisar la tasa del dólar

on:
  workflow_dispatch:

jobs:
  notify-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar broadcast sin enviar nada
        env:
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
        run: |
          SUPABASE_URL=$(grep -oP "const BIZ_URL = '\K[^']+" www/index.html)
          echo "--- clave incorrecta:"
          curl -s -w "  [%{http_code}]\n" -X POST "$SUPABASE_URL/functions/v1/broadcast" -H "Authorization: Bearer x" -H "Content-Type: application/json" -d '{}'
          echo "--- clave real, categoría inexistente (no envía nada):"
          curl -s -w "  [%{http_code}]\n" -X POST "$SUPABASE_URL/functions/v1/broadcast" -H "Authorization: Bearer $BROADCAST_SECRET" -H "Content-Type: application/json" -d '{"title":"x","body":"x","filter":"prueba"}'
