name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ícono y pantalla de inicio
        continue-on-error: true
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#14161b' --iconBackgroundColorDark '#14161b'
          --splashBackgroundColor '#14161b' --splashBackgroundColorDark '#14161b'

      - name: Copiar la web al proyecto
        run: npx cap sync android

      # Selector de contactos del teléfono (código nativo propio en la carpeta native/).
      # Solo pide permiso de LECTURA de contactos. Se prueba que compile; si por
      # cualquier motivo no compila, el siguiente paso lo quita y la app se
      # construye igual, solo que sin la función de importar contactos.
      - name: Agregar selector de contactos
        id: contactos
        continue-on-error: true
        run: |
          set -e
          PKG_DIR=android/app/src/main/java/com/misfinanzas/cup
          test -d "$PKG_DIR"
          cp native/ContactPickerPlugin.java "$PKG_DIR/ContactPickerPlugin.java"
          cp native/MainActivity.java "$PKG_DIR/MainActivity.java"
          python3 scripts/add_contacts_permission.py android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew :app:compileReleaseJavaWithJavac

      - name: Quitar selector de contactos (solo si no compiló)
        if: steps.contactos.outcome == 'failure'
        run: |
          PKG_DIR=android/app/src/main/java/com/misfinanzas/cup
          [ -d "$PKG_DIR" ] || exit 0
          rm -f "$PKG_DIR/ContactPickerPlugin.java"
          printf 'package com.misfinanzas.cup;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {}\n' > "$PKG_DIR/MainActivity.java"
          sed -i '/android.permission.READ_CONTACTS/d' android/app/src/main/AndroidManifest.xml
          echo "AVISO: el selector de contactos no compiló; la app se construye sin esa función."

      # Número de versión que sube en cada compilación
      # Toma el número de APP_VERSION del index.html (el mismo que sale en Ajustes)
      # Notificaciones push cuando se registra una venta (Firebase). Mientras no
      # exista native/google-services.json (se agrega junto con la dependencia
      # en package.json, cuando configures Firebase), este paso se salta solo
      # y la app se compila exactamente igual que hoy, sin notificaciones.
      - name: Agregar notificaciones push (Firebase)
        id: push
        continue-on-error: true
        run: |
          set -e
          if [ ! -f native/google-services.json ]; then
            echo "Sin native/google-services.json todavia: se omite este paso."
            exit 0
          fi
          cp native/google-services.json android/app/google-services.json
          python3 scripts/add_push_notifications.py android/build.gradle android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew :app:compileReleaseJavaWithJavac

      - name: Quitar notificaciones push (solo si no compiló)
        if: steps.push.outcome == 'failure'
        run: |
          rm -f android/app/google-services.json
          sed -i "/com.google.gms:google-services/d" android/build.gradle
          sed -i "/com.google.gms.google-services/d" android/app/build.gradle
          echo "AVISO: las notificaciones push no compilaron; la app se construye sin esa función."

      - name: Versión
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[^']+" www/index.html)
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Versión de producción (no de depuración): Play Protect la ve con menos sospecha
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      # Siempre la misma firma: así cada APK nuevo se instala encima
      # del anterior sin borrar tus datos. No es la firma de depuración de
      # Android (eso es justo lo que hacía sospechar a Play Protect).
      - name: Firmar APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
          $BT/apksigner sign --ks keystore/release.keystore --ks-pass pass:'Wllt#Cuba2026x' \
            --ks-key-alias walletapp --key-pass pass:'Wllt#Cuba2026x' \
            --out Wallet.apk alineado.apk
          $BT/apksigner verify Wallet.apk
          echo "--- Permisos de la app final ---"
          $BT/aapt2 dump permissions Wallet.apk || true

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: Wallet ${{ env.VER }}
          files: Wallet.apk

      # Avisa de la versión nueva solo UNA vez por versión (guarda la última
      # avisada en un archivo del propio repositorio). Si falla el aviso,
      # no tumba la compilación: el APK ya quedó publicado igual.
      - name: Avisar la versión nueva
        continue-on-error: true
        env:
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
        run: |
          mkdir -p .github/state
          ARCHIVO=.github/state/ultima_version_avisada.txt
          ANTERIOR=$(cat "$ARCHIVO" 2>/dev/null || echo "")
          if [ "$ANTERIOR" = "$VER" ]; then
            echo "La version $VER ya se habia avisado antes; no se repite."
            exit 0
          fi
          if [ -z "$BROADCAST_SECRET" ]; then
            echo "Falta el secreto BROADCAST_SECRET; no se puede avisar todavia."
            exit 0
          fi
          SUPABASE_URL=$(grep -oP "const BIZ_URL = '\K[^']+" www/index.html)
          if [ -z "$SUPABASE_URL" ]; then
            echo "No encontre BIZ_URL en www/index.html (¿todavia no conectaste Supabase?)."
            exit 0
          fi

          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/broadcast" \
            -H "Authorization: Bearer $BROADCAST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"Wallet se actualizó\",\"body\":\"Ya está disponible la versión $VER. Entra a Ajustes para buscarla.\",\"filter\":\"notify_update\"}")
          echo "Codigo de respuesta: $http_code"
          cat /tmp/resp.json

          echo "$VER" > "$ARCHIVO"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ARCHIVO"
          git commit -m "Version avisada: $VER" || true
          git push || true
