name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ícono y pantalla de inicio
        continue-on-error: true
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#14161b' --iconBackgroundColorDark '#14161b'
          --splashBackgroundColor '#14161b' --splashBackgroundColorDark '#14161b'

      - name: Copiar la web al proyecto
        run: npx cap sync android

      # Siempre la misma firma: así cada APK nuevo se instala encima
      # del anterior sin borrar tus datos
      - name: Firma fija
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MisFinanzas.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mis Finanzas v${{ github.run_number }}
          files: MisFinanzas.apk
