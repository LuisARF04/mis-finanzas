name: Actualizar tasa de El Toque y QvaPay

on:
  schedule:
    - cron: '0 * * * *'   # cada hora, en punto (hora UTC)
  workflow_dispatch:        # y también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # USD y MLC: lee la página pública de El Toque. Algunos sitios bloquean
      # las peticiones que vienen directo de un servidor de GitHub (código 403),
      # así que primero se intenta a través de un lector (r.jina.ai), y si eso
      # falla, se intenta directo como respaldo.
      - name: Leer USD y MLC de El Toque
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          URL="https://eltoque.com/tasas-de-cambio-cuba/mercado-informal"

          http_code=$(curl -sL --retry 2 --retry-delay 3 --max-time 30 -A "$UA" \
            -o /tmp/page.html -w "%{http_code}" \
            "https://r.jina.ai/$URL")
          echo "Codigo via r.jina.ai: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "r.jina.ai no respondio bien, se intenta directo..."
            http_code=$(curl -sL --retry 2 --retry-delay 3 --max-time 30 -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: es-ES,es;q=0.9,en;q=0.8" \
              -o /tmp/page.html -w "%{http_code}" \
              "$URL")
            echo "Codigo directo: $http_code"
          fi

          if [ "$http_code" != "200" ]; then
            echo "Ninguna de las dos formas funciono (codigo final $http_code)."
            exit 1
          fi
          python3 scripts/parse_rate.py

      # SQP: lee el canal público de Telegram de QvaPay, donde publican
      # sus propias tasas P2P (cambiocup.com no se puede leer directo
      # porque arma sus números con JavaScript).
      - name: Leer SQP del canal de Telegram de QvaPay
        continue-on-error: true   # si esto falla, que no tumbe la tasa de USD/MLC que ya se guardó
        run: |
          http_code=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o /tmp/telegram.html -w "%{http_code}" \
            https://t.me/s/QvaPay_com)
          echo "Codigo de respuesta: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Telegram no respondio con exito (codigo $http_code)."
            exit 1
          fi
          python3 scripts/parse_sqp.py

      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --quiet --cached && echo "Sin cambios en la tasa" || git commit -m "Actualizar tasas (El Toque / QvaPay)"
          git push
