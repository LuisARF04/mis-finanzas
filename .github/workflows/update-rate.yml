name: Actualizar tasa de El Toque y QvaPay

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Probar fuentes
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          probe(){ code=$(curl -sL -A "$UA" --max-time 25 -o /tmp/p.html -w "%{http_code}" "$1"); size=$(wc -c </tmp/p.html); echo "=== $1 -> $code ($size bytes)"; python3 - "$2" <<'PY'
          import re,sys,html
          t=open('/tmp/p.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          pat=sys.argv[1]
          hits=[m.start() for m in re.finditer(pat,t,re.I)]
          print('  coincidencias "%s": %d'%(pat,len(hits)))
          for h in hits[-3:]: print('  ...',t[max(0,h-120):h+160])
          if not hits: print('  inicio:',t[:300])
          PY
          }
          probe https://t.me/s/eltoquecom "USD"
          probe https://t.me/s/eltoquecom2 "USD"
          probe https://t.me/s/eltoque "USD"
          probe https://eltoque.com/tasas-de-cambio-de-moneda-en-cuba-hoy "USD"
          probe https://eltoque.com/ "tasa"
          probe https://tasas.eltoque.com/v1/trmi "."
          probe https://www.cibercuba.com/noticias/tasa-de-cambio "USD"
          probe https://www.directoriocubano.info/feed/ "USD"
          probe https://api.cambiocuba.money/api/v1/x-rates "USD"
